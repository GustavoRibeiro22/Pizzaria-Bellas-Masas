<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cardápio | Pizzaria Bella Massa</title>
  <link rel="stylesheet" href="css.css" />
</head>
<body>
  <header>
    <div class="container header-content">
      <img src="logotipo.jpg" alt="Logo da Pizzaria Bella Massa" class="logo" />
      <nav>
        <a href="index.html">Início</a>
        <a href="Cardapio.html" class="ativo">Cardápio</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section>
      <h2 class="section-title">Nosso Cardápio</h2>
      <div class="menu-grid">
        <div class="pizza-card">
          <img src="cala.jpg" alt="Pizza Calabresa">
          <div class="pizza-info">
            <h3>Calabresa</h3>
            <p>Calabresa, cebola roxa e mussarela</p>
            <span class="preco">R$ 38,00</span>
          </div>
        </div>

        <div class="pizza-card">
          <img src="marg.jpg" alt="Pizza Margherita">
          <div class="pizza-info">
            <h3>Margherita</h3>
            <p>Molho de tomate, mussarela e manjericão</p>
            <span class="preco">R$ 35,00</span>
          </div>
        </div>

        <div class="pizza-card">
          <img src="4q.jpg" alt="Pizza Quatro Queijos">
          <div class="pizza-info">
            <h3>Quatro Queijos</h3>
            <p>Gorgonzola, parmesão, catupiry e mussarela</p>
            <span class="preco">R$ 42,00</span>
          </div>
        </div>
      </div>
    </section>

    <section>
      <h2 class="section-title">Onde Estamos</h2>
      <div class="mapa">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3656.235252034803!2d-45.401039!3d-23.7781529!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94d29bbb651e35d3:0x6021e122f78d0fb7!2sAv.%20Manoel%20Hip%C3%B3lito%20do%20R%C3%AAgo,%201337%20-%20Pontal%20da%20Cruz,%20S%C3%A3o%20Sebasti%C3%A3o%20-%20SP,%2011600-000!5e0!3m2!1spt-BR!2sbr!4v1618576415420"
          width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy">
        </iframe>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2025 Pizzaria Bella Massa | Todos os direitos reservados</p>
  </footer>

</html>
